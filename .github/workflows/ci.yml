name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Lint
        run: ruff check dags/ src/

      - name: Validate DAG syntax
        run: |
          python -c "
          import ast, sys
          path = 'dags/rainforest_pipeline.py'
          with open(path) as f:
              source = f.read()
          try:
              ast.parse(source)
              print('OK:', path)
          except SyntaxError as e:
              print('SYNTAX ERROR:', path, str(e))
              sys.exit(1)
          "
